[project]
name = "realestate-stats-mcp"
version = "0.2.0"
description = "한국부동산원 R-ONE 부동산통계 Open API MCP 서버 (stdio / HTTP, 클라이언트 무관)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
realestate-stats-mcp = "realestate_stats_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realestate_stats_mcp"]
